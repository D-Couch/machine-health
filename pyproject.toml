[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-health"
version = "0.1.0"
description = "Leakage-aware turbofan remaining-useful-life baseline and replay dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "streamlit>=1.35", "plotly>=5.20", "joblib>=1.3", "requests>=2.31", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
temporal = ["torch>=2.5,<3"]

[project.scripts]
machine-health = "machine_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
